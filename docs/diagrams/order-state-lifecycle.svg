<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de estados do pedido</title>
  <desc id="desc">O pedido passa de recebido para enriquecendo e termina enriquecido ou em falha de enriquecimento. Erros transitórios repetem o processamento e itens na DLQ podem ser reprocessados manualmente.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#33414d"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f766e"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a84545"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 40px; font-weight: 750; fill: #17212b; }
      .subtitle { font-size: 19px; fill: #5e6a73; }
      .state { font-size: 23px; font-weight: 800; fill: #17212b; }
      .state-long { font-size: 20px; font-weight: 800; fill: #17212b; }
      .copy { font-size: 16px; fill: #53616c; }
      .label { font-size: 16px; font-weight: 700; fill: #33414d; }
      .small { font-size: 14px; fill: #65717a; }
      .line { fill: none; stroke: #33414d; stroke-width: 3; marker-end: url(#arrow); }
      .line-teal { fill: none; stroke: #1f766e; stroke-width: 3; marker-end: url(#arrow-teal); }
      .line-red { fill: none; stroke: #a84545; stroke-width: 3; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect width="1600" height="940" fill="#f7f8f7"/>
  <rect x="52" y="44" width="8" height="76" fill="#1f766e"/>
  <text x="84" y="78" class="sans title">Ciclo de estados do pedido</text>
  <text x="84" y="110" class="sans subtitle">Transições explícitas protegem o processamento contra entregas repetidas da fila</text>

  <circle cx="78" cy="395" r="23" fill="#33414d"/>
  <text x="78" y="443" text-anchor="middle" class="sans small">início</text>

  <g aria-label="Estado recebido">
    <rect x="160" y="302" width="290" height="186" rx="8" fill="#eaf2fb" stroke="#326aa3" stroke-width="3"/>
    <rect x="184" y="326" width="92" height="27" rx="4" fill="#d8e8f8"/>
    <text x="230" y="345" text-anchor="middle" class="sans small" font-weight="750" fill="#285982">PERSISTIDO</text>
    <text x="184" y="397" class="sans state">RECEIVED</text>
    <text x="184" y="431" class="sans copy">Pedido salvo; job</text>
    <text x="184" y="457" class="sans copy">aguardando processamento.</text>
  </g>

  <g aria-label="Estado enriquecendo">
    <rect x="650" y="282" width="340" height="226" rx="8" fill="#fff2d6" stroke="#9a6715" stroke-width="3"/>
    <rect x="674" y="306" width="105" height="27" rx="4" fill="#f7dda5"/>
    <text x="726" y="325" text-anchor="middle" class="sans small" font-weight="750" fill="#765016">EM CURSO</text>
    <text x="674" y="377" class="sans state">ENRICHING</text>
    <text x="674" y="411" class="sans copy">Worker consulta o catálogo,</text>
    <text x="674" y="437" class="sans copy">calcula totais e tenta câmbio.</text>
    <text x="674" y="476" class="sans small">Pode reentrar no mesmo estado.</text>
  </g>

  <g aria-label="Estado enriquecido">
    <rect x="1180" y="302" width="290" height="186" rx="8" fill="#eaf5e8" stroke="#477d3e" stroke-width="3"/>
    <rect x="1204" y="326" width="87" height="27" rx="4" fill="#d7ead3"/>
    <text x="1247" y="345" text-anchor="middle" class="sans small" font-weight="750" fill="#386531">SUCESSO</text>
    <text x="1204" y="397" class="sans state">ENRICHED</text>
    <text x="1204" y="431" class="sans copy">Itens e totais prontos.</text>
    <text x="1204" y="457" class="sans copy">Estado final e idempotente.</text>
  </g>

  <g aria-label="Estado de falha">
    <rect x="650" y="676" width="340" height="190" rx="8" fill="#fdeaea" stroke="#a84545" stroke-width="3"/>
    <rect x="674" y="700" width="119" height="27" rx="4" fill="#f6d0d0"/>
    <text x="733" y="719" text-anchor="middle" class="sans small" font-weight="750" fill="#873737">NA DLQ</text>
    <text x="674" y="771" class="sans state-long">FAILED_ENRICHMENT</text>
    <text x="674" y="805" class="sans copy">Falha auditável; permite</text>
    <text x="674" y="831" class="sans copy">reprocessamento manual.</text>
  </g>

  <circle cx="1538" cy="395" r="25" fill="none" stroke="#33414d" stroke-width="3"/>
  <circle cx="1538" cy="395" r="15" fill="#33414d"/>
  <text x="1538" y="443" text-anchor="middle" class="sans small">fim</text>

  <path d="M101 395 H160" class="line-teal"/>
  <path d="M450 395 H650" class="line-teal"/>
  <rect x="482" y="352" width="138" height="28" rx="4" fill="#f7f8f7"/>
  <text x="551" y="372" text-anchor="middle" class="sans label">worker inicia</text>

  <path d="M990 395 H1180" class="line-teal"/>
  <rect x="1016" y="352" width="138" height="28" rx="4" fill="#f7f8f7"/>
  <text x="1085" y="372" text-anchor="middle" class="sans label">catálogo OK</text>

  <path d="M1470 395 H1513" class="line-teal"/>

  <path d="M716 282 C716 174 924 174 924 282" class="line"/>
  <rect x="704" y="154" width="232" height="67" rx="8" fill="#fffaf0" stroke="#d5b56e" stroke-width="2"/>
  <text x="820" y="181" text-anchor="middle" class="sans label">erro transitório</text>
  <text x="820" y="205" text-anchor="middle" class="sans small">2s / 4s / 8s + jitter até 1s</text>

  <path d="M820 508 V676" class="line-red"/>
  <rect x="846" y="552" width="300" height="76" rx="8" fill="#fff4f4" stroke="#d99a9a" stroke-width="2"/>
  <text x="868" y="582" class="sans label">falha definitiva</text>
  <text x="868" y="607" class="sans small">sem retry ou 4 tentativas</text>

  <path d="M650 779 H548 V443 H650" class="line"/>
  <rect x="278" y="665" width="270" height="78" rx="8" fill="#ffffff" stroke="#aeb9bf" stroke-width="2"/>
  <text x="300" y="696" class="sans label">reprocessamento manual</text>
  <text x="300" y="721" class="sans small">retorna ao worker pela DLQ</text>

  <g aria-label="Observação sobre entrega repetida">
    <rect x="1180" y="568" width="368" height="106" rx="8" fill="#ffffff" stroke="#8aa48a" stroke-width="2"/>
    <text x="1204" y="600" class="sans label">Entrega at-least-once</text>
    <text x="1204" y="628" class="sans copy">Se o job reaparecer após ENRICHED,</text>
    <text x="1204" y="653" class="sans copy">o worker encerra sem processar de novo.</text>
  </g>

  <line x1="52" y1="901" x2="1548" y2="901" stroke="#cfd7da"/>
  <text x="52" y="926" class="sans small">A cotação é opcional: sua indisponibilidade não muda o pedido de ENRICHING para FAILED_ENRICHMENT.</text>
</svg>
